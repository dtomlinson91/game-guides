name: Deploy route planner to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "fire-emblem-three-houses/route-planner/**"
      - ".github/workflows/route-planner-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push cancels a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish only the app files, not the README, SPEC or generator.
      - name: Assemble site
        run: |
          mkdir _site
          cd fire-emblem-three-houses/route-planner
          cp index.html styles.css app.js rules.js data.js ../../_site/
          touch ../../_site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
